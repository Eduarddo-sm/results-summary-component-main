<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- displays site properly based on user's device -->

  <link rel="icon" type="image/png" sizes="32x32" href="./assets/images/favicon-32x32.png">

  <title>Frontend Mentor | Results summary component</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <div role="main" class="card">
    <div class="section-one">
      <p>Your Result</p>

      <div class="circle">
        <h1>76</h1>
        <p>of 100</p>
      </div>

      <h2>Great</h2>
      <p>You scored higher than 65% of the people who have taken these tests.</p>

    </div>
    <div class="section-two">
      <div class="text">Summary</div>
      <div class="block-list">
        <div class="list list-one">
          <p class="left-txt-list-one">
            <img src="./assets/images/icon-reaction.svg" aria-hidden="true">Reaction</p>
          <p class="right-txt-list-one"><strong>80</strong> / 100</p>
        </div>
        <div class="list list-two">
          <p class="left-txt-list-two"><img src="./assets/images/icon-memory.svg" aria-hidden="true">Memory</p>
          <p class="right-txt-list-two"><strong>92</strong> / 100</p>
        </div>
        <div class="list list-three">
          <p class="left-txt-list-three"><img src="./assets/images/icon-verbal.svg" aria-hidden="true"> Verbal</p>
          <p class="right-txt-list-three"><strong>61</strong> / 100</p>
        </div>
        <div class="list list-four">
          <p class="left-txt-list-four"><img src="./assets/images/icon-visual.svg" aria-hidden="true"> Visual</p>
          <p class="right-txt-list-four"><strong>73</strong> / 100</p>
        </div>
      </div>
      <button>Continue</button>
    </div>
  </div>

  <!-- <div class="attribution">
    Challenge by <a href="https://www.frontendmentor.io?ref=challenge" target="_blank">Frontend Mentor</a>.
    Coded by <a href="#">Your Name Here</a>.
  </div> -->
</body>

</html>
